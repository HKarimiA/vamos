[package]
name = "vamos"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
leptos = { version = "0.8.15", features = ["csr"] }
leptos_router = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
